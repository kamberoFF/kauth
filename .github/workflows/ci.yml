name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kauth
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      # The shared rate-limit store (ADR 0005) counts against Redis, and the
      # test harness clears its keys between scenarios — tests require it,
      # same as local dev's "docker compose up -d db redis". Without it every
      # resetDatabase() throws and the suite collapses.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kauth?schema=public
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kauth_test?schema=public
      JWT_SECRET: ci-jwt-secret-value-at-least-32-chars-long
      COOKIE_SECRET: ci-cookie-secret-value-at-least-32-chars

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The backend test suite compiles and exercises both SDK packages'
      # sources directly (tests/clientSdk.test.ts imports them), so their
      # peer/dev deps — react for client-sdk's session-hook probe — must be
      # installed or typecheck fails on unresolvable bare imports.
      - name: Install client-sdk dependencies
        working-directory: packages/client-sdk
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun run prisma:generate

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun test

      - name: Audit dependencies
        run: bun audit --audit-level=high
        continue-on-error: true

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build
